baseURL = 'https://im-asif.github.io/'
languageCode = 'en-us'
title = 'Asif Iqbal'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  [params.assets]
    disableHLJS = false
  mermaid = true

  # Profile card settings shown on the homepage.
  [params.profileMode]
    enabled = true
    title = "Asif Iqbal"
    subtitle = "Senior DevOps Engineer @ Dell Technologies | Ex-TCS | SRE | Cloud"
    bio = "Senior DevOps Engineer with 9+ years of experience specializing in Cloud Architecture (AWS/Azure), Kubernetes, and Infrastructure Automation."
    imageUrl = "https://github.com/im-asif.png"
    imageTitle = "Asif Iqbal"
    imageWidth = 150
    imageHeight = 150

    [[params.profileMode.buttons]]
      name = "LinkedIn"
      url = "https://www.linkedin.com/in/im-asif"
    [[params.profileMode.buttons]]
      name = "Email"
      url = "mailto:asif121.iqbal@gmail.com"
    [[params.profileMode.buttons]]
      name = "GitHub"
      url = "https://github.com/im-asif"

  # Footer social links.
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/im-asif"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/im-asif"

