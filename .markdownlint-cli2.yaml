config:
  default: true
  MD013: false # Allow long lines in prose/front matter and Mermaid blocks
  MD033: false # Allow inline HTML when needed by themes/content
  MD041: false # Front matter-based pages don't always start with an H1

globs:
  - "**/*.md"
ignores:
  - "**/node_modules/**"
  - "**/.git/**"
